<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Office</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="office-key" content="%%OFFICE_KEY%%">
<meta name="fresh" content="%%FRESH%%">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<link rel="icon" href="assets/emoji/office_building.png">
<script>try{var t=localStorage.getItem("ai-office-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="logo"><img src="assets/emoji/office_building.png" alt="">AI Office<span class="co" id="company"></span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="right">
    <button class="stat" id="stat" title="Who is working now"></button>
    <span class="sep"></span>
    <span class="mono faint" id="where"></span>
    <button class="ibtn" id="theme" type="button" aria-label="Switch theme"></button>
    <button class="ibtn" data-go="settings" title="Settings" aria-label="Settings" id="gear"></button>
  </div>
</header>
<div class="sub" id="sub"></div>
<main id="views"></main>
<aside id="okDrawer" aria-label="Needs your OK"></aside>
<div class="modal" id="modal"><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<div class="sr" id="liveErr" role="alert"></div>
<script type="module" src="app.js"></script>
</body>
</html>
